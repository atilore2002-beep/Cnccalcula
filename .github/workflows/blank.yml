YAML

name: CNC Calculadora Pro APK

'on':
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: unzip -q CNC_Calculadora_Pro_Android_GitHub.zip -d extracted

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: extracted/CNCCalculadoraPro
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CNC-Calculadora-Pro-APK
          path: extracted/CNCCalculadoraPro/app/build/outputs/apk/debug/app-debug.apk
