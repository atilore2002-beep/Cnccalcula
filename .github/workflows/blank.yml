YAML

name: CNC Calculadora Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q CNC_Calculadora_Pro_Android_GitHub.zip -d .

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar aplicación Android
        working-directory: CNCCalculadoraPro
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CNC-Calculadora-Pro-APK
          path: CNCCalculadoraPro/app/build/outputs/apk/debug/app-debug.apk
